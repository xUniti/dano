version: 2
updates:
  # JavaScript / SvelteKit dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Rust / Tauri dependencies
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The GitHub Actions used in our workflows (fixes Node-version deprecations over time)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
